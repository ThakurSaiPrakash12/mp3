server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy WebSocket connections to the backend container
    location /ws {
        proxy_pass         http://backend:5000/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Proxy all REST API calls to the backend container
    # This matches: /login /products /sales /dashboard /forecast /suppliers /purchases /reorder-check /docs /redoc
    location ~* ^/(login|products|sales|dashboard|forecast|suppliers|purchases|reorder-check|audit|csv-upload|docs|redoc|openapi.json) {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Serve React SPA — all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
